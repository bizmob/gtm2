<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTM Field Engine</title>
    
    <!-- Mobile App Capabilities Configuration -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    
    <!-- Manifest Link for App Icon and Installation -->
    <link rel="manifest" href="manifest.json">

    <style>
        :root {
            --bg-dark: #0A0A0A;
            --card-bg: #141414;
            --accent-gold: #D4AF37;
            --text-light: #FFFFFF;
            --text-muted: #A0A0A0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .launcher-card {
            background-color: var(--card-bg);
            padding: 35px 25px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            max-width: 400px;
            width: 100%;
            text-align: center;
            border: 1px solid #222;
        }

        .app-branding {
            margin-bottom: 35px;
        }

        .app-logo-placeholder {
            width: 75px;
            height: 75px;
            background: linear-gradient(135deg, #1f1f1f, #0a0a0a);
            border: 2px solid var(--accent-gold);
            border-radius: 18px;
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: bold;
            color: var(--accent-gold);
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.2);
        }

        h1 {
            font-size: 22px;
            font-weight: 700;
            margin: 0 0 8px 0;
            letter-spacing: 0.5px;
        }

        .subtitle {
            font-size: 13px;
            color: var(--text-muted);
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .button-stack {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .launch-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: #1A1A1A;
            color: var(--text-light);
            border: 1px solid #333;
            padding: 18px 20px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .launch-btn:active {
            transform: scale(0.98);
            background-color: #222;
            border-color: var(--accent-gold);
        }

        .btn-meta {
            display: flex;
            align-items: center;
            gap: 14px;
            text-align: left;
        }

        .btn-icon {
            font-size: 22px;
            width: 30px;
            text-align: center;
        }

        .btn-title {
            display: block;
            font-size: 15px;
        }

        .btn-desc {
            display: block;
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 400;
            margin-top: 2px;
        }

        .chevron {
            color: var(--accent-gold);
            font-weight: bold;
            font-size: 18px;
        }

        /* Ambient Footer info */
        .footer-version {
            margin-top: 30px;
            font-size: 10px;
            color: #444;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

<div class="launcher-card">
    <div class="app-branding">
        <!-- System Icon Visual -->
        <div class="app-logo-placeholder">Ω</div>
        <h1>FIELD OPERATIONS</h1>
        <p class="subtitle">Go-To-Market Console</p>
    </div>

    <div class="button-stack">
        <!-- Button 1: B2B Merchant Matrix -->
        <a href="b2b-closer.html" class="launch-btn">
            <div class="btn-meta">
                <span class="btn-icon">💼</span>
                <div>
                    <span class="btn-title">B2B Wholesale Hub</span>
                    <span class="btn-desc">Merchant orders & pipeline trade</span>
                </div>
            </div>
            <span class="chevron">→</span>
        </a>

        <!-- Button 2: D2C Customer Activation -->
        <a href="d2c-seller.html" class="launch-btn">
            <div class="btn-meta">
                <span class="btn-icon">⚡</span>
                <div>
                    <span class="btn-title">D2C Consumer Engine</span>
                    <span class="btn-desc">Direct activations & rapid retail sales</span>
                </div>
            </div>
            <span class="chevron">→</span>
        </a>

        <!-- Button 3: Live Looker Executive Dashboard -->
        <!-- Swap the href below out with your shared Looker Studio link when configured -->
        <a href="https://lookerstudio.google.com/" target="_blank" class="launch-btn">
            <div class="btn-meta">
                <span class="btn-icon">📊</span>
                <div>
                    <span class="btn-title">Management Analytics</span>
                    <span class="btn-desc">Real-time charts, KPIs & field performance</span>
                </div>
            </div>
            <span class="chevron">→</span>
        </a>
    </div>

    <div class="footer-version">CORE ENGINE V2.6 • SYSTEM ONLINE</div>
</div>

</body>
</html>
